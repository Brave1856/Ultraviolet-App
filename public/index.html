
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="tab-title">Workspace Portal</title>
    <!-- Masking icon defaulting to standard Google Workspace appearance -->
    <link id="tab-icon" rel="icon" type="image/x-icon" href="https://gstatic.com">
    
    <style>
        /* Minimalist Monochrome Design System */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 24px;
            overflow-x: hidden;
        }

        /* Subtle Top Navigation */
        nav {
            width: 100%;
            max-width: 1000px;
            padding: 30px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #222222;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #ffffff;
        }

        /* High-Contrast Stealth Button */
        .panic-btn {
            background: #ffffff;
            color: #000000;
            border: 1px solid #ffffff;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.8rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.2s ease;
        }

        .panic-btn:hover {
            background: #000000;
            color: #ffffff;
        }

        /* Focus Area: Central Search Block */
        .main-container {
            text-align: center;
            margin: 100px 0 60px 0;
            width: 100%;
            max-width: 600px;
        }

        .main-container h1 {
            font-size: 3.5rem;
            font-weight: 300;
            letter-spacing: 8px;
            text-transform: uppercase;
            margin-bottom: 40px;
        }

        .search-field-wrapper {
            width: 100%;
        }

        .search-bar {
            width: 100%;
            padding: 18px 24px;
            border-radius: 4px;
            border: 1px solid #333333;
            background: #0a0a0a;
            color: #ffffff;
            font-size: 1rem;
            outline: none;
            letter-spacing: 0.5px;
            transition: border-color 0.3s ease, background-color 0.3s ease;
        }

        .search-bar:focus {
            border-color: #ffffff;
            background: #111111;
        }

        /* Navigational Category Grid */
        .nav-grid {
            width: 100%;
            max-width: 1000px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 60px;
        }

        /* Stark Grid Buttons */
        .nav-button {
            background: #0a0a0a;
            border: 1px solid #222222;
            border-radius: 4px;
            padding: 40px 20px;
            text-align: center;
            text-decoration: none;
            color: #888888;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .nav-button:hover {
            border-color: #ffffff;
            color: #ffffff;
            background: #111111;
        }

        .nav-button h3 {
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Mobile Optimization Rules */
        @media (max-width: 768px) {
            .main-container h1 { font-size: 2.5rem; }
            .nav-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
            .nav-button { padding: 30px 10px; }
        }
    </style>
</head>
<body>

    <!-- Main Navigation Bar -->
    <nav>
        <div class="logo">Infinite</div>
        <button class="panic-btn" onclick="executePanicRoutine()">Panic (Esc)</button>
    </nav>

    <!-- Core Search Layout -->
    <div class="main-container">
        <h1>Infinite</h1>
        <div class="search-field-wrapper">
            <form id="routing-form">
                <input type="text" class="search-bar" id="target-query" placeholder="Search unblocked web directory...">
            </form>
        </div>
    </div>

    <!-- Hub Category Router Menu -->
    <div class="nav-grid">
        <div class="nav-button" onclick="changeAppView('movies')">
            <h3>Movies</h3>
        </div>
        <div class="nav-button" onclick="changeAppView('games')">
            <h3>Games</h3>
        </div>
        <div class="nav-button" onclick="changeAppView('ai')">
            <h3>AI Tools</h3>
        </div>
        <div class="nav-button" onclick="changeAppView('settings')">
            <h3>Settings</h3>
        </div>
    </div>

    <script>
        // --- 1. Form Web Routing Management ---
        const searchForm = document.getElementById('routing-form');
        const searchInput = document.getElementById('target-query');

        searchForm.addEventListener('submit', (e) => {
            e.preventDefault();
            let destinationUrl = searchInput.value.trim();
            if (!destinationUrl) return;

            // Direct link normalization vs search query processing
            if (!destinationUrl.includes('.') || destinationUrl.includes(' ')) {
                destinationUrl = 'https://google.com' + encodeURIComponent(destinationUrl);
            } else if (!destinationUrl.startsWith('http://') && !destinationUrl.startsWith('https://')) {
                destinationUrl = 'https://' + destinationUrl;
            }

            processProxyLaunch(destinationUrl);
        });

        // --- 2. Dynamic Routing Views ---
        function changeAppView(viewTarget) {
            // Evaluates which card button was triggered, forwarding the frame to separate directories
            if (viewTarget === 'movies') {
                window.location.href = '/movies.html';
            } else if (viewTarget === 'games') {
                window.location.href = '/games.html';
            } else if (viewTarget === 'ai') {
                window.location.href = '/ai.html';
            } else if (viewTarget === 'settings') {
                window.location.href = '/settings.html';
            }
        }

        function processProxyLaunch(targetUrl) {
            // Core standard initialization string checking against Ultraviolet client configurations
            if (window.__uv_config) {
                window.location.href = __uv_config.prefix + __uv_config.encodeUrl(targetUrl);
            } else {
                alert("Proxy proxy backend framework routing modules are offline. Confirm main server deployment script status.");
            }
        }

        // --- 3. Cloaking Infrastructure Control ---
        function executePanicRoutine() {
            // Immediate destruction of the active layout layer to bypass tracking eyes
            document.body.innerHTML = `
                <div style="background: #ffffff; color: #5f6368; padding: 40px; font-family: Arial, sans-serif; height: 100vh; width: 100vw; position: fixed; top: 0; left: 0;">
                    <h1 style="color: #1f1f1f; font-size: 24px; font-weight: 400; margin: 0;">Classes</h1>
                    <p style="font-size: 14px; margin-top: 12px;">Syncing profile dashboard data streams...</p>
                </div>
            `;
            document.body.style.backgroundColor = "#ffffff";

            // Modify active document titles and structural favicons to mimic authentic dashboarding
            document.getElementById('tab-title').innerText = "Classes";
            document.getElementById('tab-icon').href = "https://gstatic.com";
            
            // Redirect window loop out of local context into secure educational subdomains
            setTimeout(() => {
                window.location.href = "https://google.com";
            }, 250);
        }

        // Hardware keyboard escape sequence listening assignment
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                executePanicRoutine();
            }
        });
    </script>
</body>
</html>
